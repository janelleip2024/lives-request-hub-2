<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Lives Request Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar with "viewing as" switcher; left rail of views; work column. Request detail = conversation | status + audit. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --sunken: #e4eae7; --line: #d3dbd7;
  --fg: #13201c; --muted: #586964;
  --accent: #0b6b5a; --accent-fg: #ffffff; --accent-soft: #d6ede6;
  --ext: #6d47a8; --ext-soft: #eee6f8;
  --warn: #9a5a06; --warn-soft: #fbeed6; --bad: #b3261e; --bad-soft: #fbe2df; --ok: #1d7a3d; --ok-soft: #dff1e5;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --pos: #2a78d6; --neg: #e34948; --grid: #e6ebe8; --axis: #c3cbc7;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #151d1a; --sunken: #1c2622; --line: #2a3632;
  --fg: #e3ebe8; --muted: #93a39e;
  --accent: #46c4a3; --accent-fg: #052219; --accent-soft: #163a31;
  --ext: #b896ea; --ext-soft: #2a2140;
  --warn: #e6a74c; --warn-soft: #3a2b13; --bad: #f0897f; --bad-soft: #3d1c19; --ok: #72d093; --ok-soft: #163222;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --pos: #3987e5; --neg: #e66767; --grid: #24302c; --axis: #3a4843;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --sunken: #1c2622; --line: #2a3632;
  --fg: #e3ebe8; --muted: #93a39e;
  --accent: #46c4a3; --accent-fg: #052219; --accent-soft: #163a31;
  --ext: #b896ea; --ext-soft: #2a2140;
  --warn: #e6a74c; --warn-soft: #3a2b13; --bad: #f0897f; --bad-soft: #3d1c19; --ok: #72d093; --ok-soft: #163222;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --pos: #3987e5; --neg: #e66767; --grid: #24302c; --axis: #3a4843;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.app { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px 24px; }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em; }
.brand b { font-size: 16px; display: block; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--muted); }
.as { display: flex; align-items: center; gap: 8px; }
.as label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.as select { max-width: 320px; }

.rail { display: flex; flex-direction: column; gap: 2px; }
.rail button { text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 500; }
.rail button:hover { background: var(--sunken); color: var(--fg); }
.rail button[aria-current=true] { background: var(--accent-soft); color: var(--fg); }
.rail .count { font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 0 7px; }
.rail .sep { height: 1px; background: var(--line); margin: 8px 0; }
.rail .note { font-size: 12px; color: var(--muted); padding: 4px 10px; }
.who { margin-top: 14px; padding: 12px; border-radius: var(--r); background: var(--sunken); font-size: 12.5px; }
.who b { display: block; font-size: 13.5px; }

main { min-width: 0; display: flex; flex-direction: column; gap: 18px; padding-bottom: 40px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkish { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 10px; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-open { background: var(--accent-soft); color: var(--accent); }
.p-info { background: var(--warn-soft); color: var(--warn); }
.p-done { background: var(--ok-soft); color: var(--ok); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.tag.ext { background: var(--ext-soft); color: var(--ext); }
.tag.po { background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sunken); }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--muted); }
.empty { padding: 22px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }

.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.fields { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.fields dt { color: var(--muted); font-size: 13px; }
.fields dd { margin: 0; overflow-wrap: anywhere; }
.masked { font-family: var(--font-mono); letter-spacing: .1em; color: var(--muted); }
.lock { font-size: 11px; color: var(--warn); font-weight: 600; margin-left: 6px; }

.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { border-radius: var(--r); padding: 10px 12px; background: var(--sunken); border: 1px solid transparent; }
.msg.shared { background: var(--ext-soft); }
.msg.system { background: none; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.msg .by { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12.5px; margin-bottom: 3px; }
.msg .by b { font-size: 13px; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.seg button[aria-pressed=true] { background: var(--fg); color: var(--bg); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 14px; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 11px; font-weight: 700; z-index: 1; }
.s-done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.s-current .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.s-info .dot { border-color: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
.s-bad .dot { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.steps .lbl { font-weight: 600; }
.steps .sub { font-size: 12.5px; color: var(--muted); }

.decide { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.decide .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.audit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; max-height: 280px; overflow-y: auto; }
.audit li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
.audit time { color: var(--muted); }

.callout { border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }
.callout.info { background: var(--accent-soft); }
.callout.ext { background: var(--ext-soft); }
.callout p { margin: 0; }

.form { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.types { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.types button { text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px; cursor: pointer; }
.types button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.types b { display: block; }
.types span { font-size: 12px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; }
.field label .req { color: var(--bad); }
.field .hint { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.route { display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 18px; }
.dup { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
.dup:first-of-type { border-top: 0; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.chain { display: flex; flex-direction: column; gap: 6px; }
.chain .link { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.chain .link b { margin-right: auto; font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }
.ext-banner { background: var(--ext-soft); color: var(--fg); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.ext-banner b { color: var(--ext); }


/* Teams card (simulated notification) */
.teams { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 360px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); z-index: 30; overflow: hidden; animation: tin .25s ease-out; --tm: #5b5fc7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .teams { --tm: #7f85f5; } }
:root[data-theme="dark"] .teams { --tm: #7f85f5; }
@keyframes tin { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.t-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.t-logo { width: 20px; height: 20px; border-radius: 5px; background: var(--tm); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.t-meta { color: var(--muted); margin-right: auto; }
.t-x { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.t-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--tm); }
.t-to { font-size: 12px; color: var(--muted); }
.t-title { font-size: 14px; }
.t-name { font-weight: 600; }
.t-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 12.5px; }
.t-facts dt { color: var(--muted); } .t-facts dd { margin: 0; overflow-wrap: anywhere; }
.t-alert { font-size: 12.5px; font-weight: 600; color: var(--bad); }
.t-note, .t-text { font-size: 12.5px; color: var(--muted); margin: 0; }
.t-body textarea { min-height: 44px; font-size: 13px; }
.t-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.teams .btn.primary { background: var(--tm); border-color: var(--tm); color: #fff; }
/* SAP B1 handoff */
pre.code { margin: 0; padding: 10px 12px; background: var(--sunken); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; line-height: 1.45; overflow-x: auto; white-space: pre; }
/* Email intake */
.intake { border-color: var(--ext); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.field.ai input, .field.ai select { border-color: var(--ext); background: var(--ext-soft); }
.aitag { font-size: 11px; font-weight: 600; color: var(--ext); margin-left: 6px; }
/* Business case calculator */
.wi { gap: 14px; }
.wi-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
.wi-row b { font-variant-numeric: tabular-nums; }
.wi-row input { grid-column: 1 / -1; width: 100%; accent-color: var(--s1); }
.wi-big { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
/* Amy's story */
.story-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.story-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.story-bar { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.story-bar i { display: block; height: 100%; border-radius: 4px; }
.story-bar i.bad, .story-end.bad { background: var(--bad); } .story-bar i.good, .story-end.good { background: var(--ok); }
.story { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.story li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; transition: opacity .3s; padding-left: 8px; border-left: 3px solid var(--line); }
.story li.bad { border-left-color: var(--bad); } .story li.good { border-left-color: var(--ok); } .story li.warn { border-left-color: var(--warn); }
.story li p { margin: 0; }
.story li span { color: var(--muted); padding-top: 1px; }
.story .pending, .story-end.pending { opacity: .12; }
.story-end { color: #fff; font-weight: 600; padding: 10px 12px; border-radius: 6px; transition: opacity .3s; }
@media (max-width: 760px) { .story-grid { grid-template-columns: minmax(0, 1fr); } }
/* Surprise moments: finish date, stuck orders, account history, cleanup toggle */
.eta { display: flex; flex-direction: column; gap: 1px; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); }
.eta b { font-size: 18px; }
.eta span { font-size: 12.5px; }
.row .right .late { color: var(--warn); font-weight: 600; }
.money { display: block; font-size: 12.5px; margin-top: 2px; }
.stuck { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--bad-soft); }
.stuck > div:first-child { display: flex; flex-direction: column; }
.stuck > div:first-child b { font-size: 24px; color: var(--bad); line-height: 1.2; }
.stuck-list { display: flex; flex-direction: column; gap: 4px; font-size: 13px; flex: 1; min-width: 220px; }
tr.gone td { background: var(--sunken); color: var(--muted); }
tr.gone .nm, tr.gone td:last-child b { text-decoration: line-through; }
tr.gone polyline { stroke: var(--muted); }
tr.gone .why { font-size: 12px; color: var(--ok); font-weight: 600; margin-top: 2px; }
tr.sub td { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface); }
/* Regional business view */
.sim { background: var(--warn-soft); color: var(--warn); }
.matrix { min-width: 560px; }
.matrix th, .matrix td { text-align: right; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix td.c { padding: 3px; }
.matrix .cellbtn { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; background: var(--surface); }
.matrix .cellbtn:hover { border-color: var(--muted); }
.matrix .cellbtn[aria-pressed=true] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.matrix .cellbtn b { font-size: 14px; font-variant-numeric: tabular-nums; }
.matrix .cellbtn span { font-size: 12px; font-variant-numeric: tabular-nums; }
.matrix tr.total td { border-bottom: 0; }
.scale { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.scale i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; }
.chart { position: relative; min-height: 270px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; }
.sw.box { height: 10px; border: 0; border-radius: 2px; width: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 170px; z-index: 5; }

<script>
(function () {
'use strict';
const KEY = 'lives-request-hub-v1';
const DAY = 864e5, HOUR = 36e5;
const COUNTRIES = { SG: 'Singapore', MY: 'Malaysia', TH: 'Thailand', VN: 'Vietnam', PH: 'Philippines' };
const ENTITIES = ['SPD', 'QTS', 'QTG'];
const ROLES = ['BU Head', 'Finance', 'Quality/Regulatory', 'Business Support', 'Procurement', 'MDM'];
const SAP_PREFIX = { Customer: 'C', Item: 'I', Vendor: 'V', 'Cost Center': 'CC' };
const DOMAIN_BLURB = { Customer: 'New hospital, lab or clinic account', Item: 'New product or material code', Vendor: 'New supplier', 'Cost Center': 'New reporting unit' };

const PEOPLE = [
  { id: 'amy', name: 'Amy', title: 'Product Manager, SPD', org: 'int', roles: ['Requestor'] },
  { id: 'marcus', name: 'Marcus', title: 'Regional Sales, QTG (new unit)', org: 'int', roles: ['Requestor', 'Sales'] },
  { id: 'weijie', name: 'Wei Jie', title: 'Finance Manager', org: 'int', roles: ['Finance'] },
  { id: 'siti', name: 'Siti', title: 'Quality & Regulatory Affairs', org: 'int', roles: ['Quality/Regulatory'] },
  { id: 'daniel', name: 'Daniel', title: 'Business Unit Head', org: 'int', roles: ['BU Head'] },
  { id: 'grace', name: 'Grace', title: 'Business Support', org: 'int', roles: ['Business Support', 'Procurement'] },
  { id: 'priya', name: 'Priya', title: 'MDM Analyst', org: 'int', roles: ['MDM'] },
  { id: 'lee', name: 'Dr. Lee', title: 'Lab Manager', company: 'Bangkok General Lab', country: 'TH', org: 'ext', kind: 'Customer' },
  { id: 'cruz', name: 'Ms. Cruz', title: 'Procurement Officer', company: 'Manila Central Clinical Lab', country: 'PH', org: 'ext', kind: 'Customer' },
  { id: 'hana', name: 'Hana', title: 'Account Manager', company: 'Meridian BioSupplies Sdn Bhd', country: 'MY', org: 'ext', kind: 'Vendor' },
];
const person = id => PEOPLE.find(p => p.id === id) || { id, name: 'Unknown', roles: [], org: 'int' };
const holderOf = role => PEOPLE.find(p => p.org === 'int' && (p.roles || []).includes(role));

/* ---------- utilities ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rel(ts) {
  const d = Date.now() - ts;
  if (d < 60e3) return 'just now';
  if (d < HOUR) return Math.round(d / 60e3) + 'm ago';
  if (d < DAY) return Math.round(d / HOUR) + 'h ago';
  return Math.round(d / DAY) + 'd ago';
}
function dur(ms) {
  if (ms < HOUR) return Math.max(1, Math.round(ms / 60e3)) + 'm';
  if (ms < DAY) return Math.round(ms / HOUR) + 'h';
  const d = Math.floor(ms / DAY), h = Math.round((ms % DAY) / HOUR);
  return d + 'd' + (h ? ' ' + h + 'h' : '');
}
function stamp(ts) {
  return new Date(ts).toLocaleString('en-SG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
}

/* Duplicate detection: normalise legal suffixes and abbreviations, then bigram (Dice) similarity. */
const ABBR = { natl: 'national', nat: 'national', univ: 'university', uni: 'university', hosp: 'hospital', med: 'medical', ctr: 'centre', center: 'centre', lab: 'laboratory', labs: 'laboratory', laboratories: 'laboratory', intl: 'international', gen: 'general', diag: 'diagnostics', diagnostic: 'diagnostics' };
const STOP = new Set(['pte', 'ltd', 'sdn', 'bhd', 'co', 'inc', 'the', 'company', 'limited', 'plc', 'jsc', 'corp', 'corporation', 'llc', 'tbk', 'pt', 'of']);
function norm(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
    .map(w => ABBR[w] || w).filter(w => w && !STOP.has(w)).join(' ');
}
function dice(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const grams = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const A = grams(a), B = grams(b); let hit = 0, total = 0;
  A.forEach(v => total += v); B.forEach(v => total += v);
  A.forEach((v, g) => { if (B.has(g)) hit += Math.min(v, B.get(g)); });
  return total ? (2 * hit) / total : 0;
}
const normTax = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function similar(name, domain, excludeId, taxId) {
  const out = [];
  /* Exact tax / registration number match: catches acronyms and renamed entities that names miss */
  const tx = normTax(taxId);
  if (tx.length >= 6) S.records.filter(r => r.type === domain && normTax(r.taxId) === tx).forEach(r => out.push({ score: 1, label: r.name, ref: r.code, where: 'In SAP B1 · same tax ID', byTax: true }));
  if (!norm(name)) return out;
  S.records.filter(r => r.type === domain && !out.some(o => o.ref === r.code)).forEach(r => {
    const score = dice(name, r.name); if (score >= 0.6) out.push({ score, label: r.name, ref: r.code, where: 'In SAP B1' });
  });
  S.requests.filter(q => q.kind === 'mdm' && q.domain === domain && q.id !== excludeId && q.state !== 'rejected' && q.state !== 'done').forEach(q => {
    const score = dice(name, q.fields.name); if (score >= 0.6) out.push({ score, label: q.fields.name, ref: q.id, where: 'Open request', reqId: q.id });
  });
  return out.sort((x, y) => y.score - x.score).slice(0, 4);
}

/* Inbound triage: tells a purchase order apart from an enquiry, and flags senders not yet set up in SAP B1. Keyword rules in this prototype. */
function classify(text, company) {
  const t = String(text).toLowerCase().replace(/[‘’]/g, "'");
  const poRef = (t.match(/\bpo\s*(?:no\.?|number|#)?\s*[:#-]?\s*(\d{3,})/) || [])[1];
  const isPO = !!poRef || /purchase order|\b(?:we'd like to|we would like to|please|kindly) (?:order|supply|deliver)|confirm(?:ing)? (?:our |the )?order|\border(?:ing)? \d+/.test(t);
  const asks = /\?|quot(?:e|ation)|pric(?:e|ing)|availab|lead time|brochure|catalog/.test(t);
  const products = [...new Set([...String(text).matchAll(/product\s*([abc])\b/gi)].map(m => 'Product ' + m[1].toUpperCase()))];
  const qty = [...String(text).matchAll(/(\d[\d,]*)\s*(kits?|boxes|units?|packs?|cartons?|vials?|cases?)\b/gi)].map(m => m[0]);
  const best = S.records.filter(r => r.type === 'Customer').map(r => ({ r, score: dice(company, r.name) })).sort((a, b) => b.score - a.score)[0];
  const known = best && best.score >= 0.9 ? best.r : null;
  const reasons = [];
  if (poRef) reasons.push('PO number ' + poRef);
  else if (isPO) reasons.push('asks to order or deliver');
  if (qty.length) reasons.push('quantities: ' + qty.join(', '));
  if (isPO && asks) reasons.push('also contains a question');
  if (!isPO) reasons.push(asks ? 'asks about price, stock or details' : 'no order wording found');
  return { kind: isPO ? 'po' : 'enquiry', products, qty, poRef: poRef || null, alsoEnquiry: isPO && asks, knownCode: known ? known.code : null, reasons };
}

/* ---------- demo data ---------- */
function defaultConfig() {
  const f = (k, label, o) => Object.assign({ k, label, req: true, sensitive: false, type: 'text' }, o || {});
  return {
    version: 1, changedBy: 'priya', changedAt: Date.now() - 20 * DAY,
    domains: {
      Customer: { fields: [f('name', 'Legal name'), f('country', 'Country', { type: 'country' }), f('address', 'Billing address'), f('taxId', 'Tax / business reg. no.'), f('creditTerms', 'Credit terms', { sensitive: true, hint: 'e.g. Net 30' }), f('contact', 'Contact email', { req: false })], chain: ['BU Head', 'Finance', 'Business Support'] },
      Item: { fields: [f('name', 'Item description'), f('productLine', 'Product line', { type: 'select', opts: ['Product A', 'Product B', 'Product C', 'Other'] }), f('uom', 'Unit of measure', { hint: 'e.g. box of 96' }), f('licence', 'Regulatory licence no.', { hint: 'Required for IVD and medical devices' }), f('hsCode', 'HS code', { req: false }), f('supplier', 'Preferred supplier', { req: false })], chain: ['Quality/Regulatory', 'BU Head', 'Business Support'] },
      Vendor: { fields: [f('name', 'Legal name'), f('country', 'Country', { type: 'country' }), f('address', 'Registered address'), f('bank', 'Bank account', { sensitive: true }), f('paymentTerms', 'Payment terms', { sensitive: true }), f('contact', 'Contact email', { req: false })], chain: ['Finance', 'Procurement', 'BU Head'] },
      'Cost Center': { fields: [f('name', 'Cost center name'), f('owner', 'Budget owner'), f('glGroup', 'GL account group'), f('purpose', 'Purpose', { req: false })], chain: ['Finance'] },
    },

}

/* Tax / business registration numbers for the demo SAP B1 mirror (customers match analytics/data/customer_records.csv) */
const TAX_IDS = { C10012: '223461923D', C10145: '0105337926063', C10230: '201801141754', C10311: '736-114-579-000', C10402: '0390164844', C10233: '201001766906', C10488: '0312345678', V20044: '201012345K', V20051: '200915432M' };
function seed() {
  const now = Date.now(), t = d => now - d * DAY;
  const cfg = defaultConfig();
  const records = [
    ['C10012', 'Customer', 'National University Hospital', 'SPD', 'SG'], ['C10145', 'Customer', 'Chiang Mai Medical Laboratory', 'SPD', 'TH'],
    ['C10230', 'Customer', 'Klang Valley Pathology Lab', 'QTS', 'MY'], ['C10311', 'Customer', 'Manila Central Clinical Lab', 'QTG', 'PH'],
    ['C10402', 'Customer', 'Hanoi Biomedical Centre', 'QTS', 'VN'], ['C10233', 'Customer', 'Penang Specialist Hospital', 'SPD', 'MY'],
    ['V20044', 'Vendor', 'Meridian BioSupplies Pte Ltd', 'SPD', 'SG'], ['V20051', 'Vendor', 'Asia Cold Chain Logistics', 'QTS', 'SG'],
    ['I30101', 'Item', 'Sterile pipette tips 1000µL, 96/rack', 'SPD', 'SG'], ['I30102', 'Item', 'Sterile pipette tips 10µL, 96/rack', 'SPD', 'SG'],
    ['I30210', 'Item', 'Product B reagent kit, 100 tests', 'QTS', 'SG'], ['I30311', 'Item', 'Product C control serum, 5 x 5 mL', 'QTG', 'SG'],
    ['CC-SPD-SLS-SG', 'Cost Center', 'SPD Sales Singapore', 'SPD', 'SG'],
  ].map(([code, type, name, entity, country]) => ({ code, type, name, entity, country, taxId: TAX_IDS[code] || '', created: t(200 + Math.random() * 300) }));

  const mk = (o) => Object.assign({ kind: 'mdm', messages: [], audit: [], state: 'open', party: null }, o);
  const step = (role, status, by, at, since) => ({ role, status, by: by || null, at: at || null, since: since || null });

  const r1041 = mk({
    id: 'MDM-1041', domain: 'Item', entity: 'SPD', country: 'SG', requester: 'amy', created: t(3.9), defs: snapshotDefs(cfg, 'Item'),

    steps: [step('Quality/Regulatory', 'done', 'siti', t(3.2)), step('BU Head', 'current', null, null, t(3.2)), step('Business Support', 'todo'), step('MDM', 'todo')],

    ],
    audit: [{ at: t(3.9), by: 'amy', text: 'Submitted. Duplicate check: 2 similar items reviewed by requester (different volume).' }, { at: t(3.2), by: 'siti', text: 'Approved Quality/Regulatory step' }, { at: t(1.2), by: 'system', text: 'Reminder sent to BU Head (Daniel) via Teams' }],
  });
  const r1042 = mk({
    id: 'MDM-1042', domain: 'Customer', entity: 'QTG', country: 'MY', requester: 'marcus', created: t(2.1), defs: snapshotDefs(cfg, 'Customer'),
    fields: { name: 'Klinik Sentosa Medical Centre', country: 'MY', address: '12 Jalan Sentosa, 41200 Klang, Selangor', taxId: '201901023456 (SSM)', creditTerms: 'Net 60, limit MYR 80,000', contact: 'purchasing@kliniksentosa.example' },
    steps: [step('BU Head', 'done', 'daniel', t(1.3)), step('Finance', 'current', null, null, t(1.3)), step('Business Support', 'todo'), step('MDM', 'todo')],

  });
  const r1036 = mk({
    id: 'MDM-1036', domain: 'Customer', entity: 'QTS', country: 'VN', requester: 'marcus', created: t(6.2), defs: snapshotDefs(cfg, 'Customer'), state: 'done', sapCode: 'C10488', closed: t(3.6),
    fields: { name: 'Saigon Diagnostics Co.', country: 'VN', address: '88 Nguyen Hue, District 1, Ho Chi Minh City', taxId: '0312345678', creditTerms: 'Net 30', contact: 'lab@saigondx.example' },
    steps: [step('BU Head', 'done', 'daniel', t(5.8)), step('Finance', 'done', 'weijie', t(4.9)), step('Business Support', 'done', 'grace', t(4.1)), step('MDM', 'done', 'priya', t(3.6))],

  });
  records.push({ code: 'C10488', type: 'Customer', name: 'Saigon Diagnostics Co.', entity: 'QTS', country: 'VN', taxId: '0312345678', created: t(3.6) });

  const S0 = { v: 2, seq: 1043, cseq: 209, config: cfg, configLog: [{ at: t(20), by: 'priya', text: 'Added "Regulatory licence no." as required for Items' }], records, requests: [r1041, r1042, r1039, r1036] };

  const conv = (id, party, at, subject, text) => {

    return mk({ id, kind: 'conv', party, requester: party, created: at, entity: null, country: p.country, subject, text, cls: classify(text, p.company), assigned: 'Sales',
      messages: [], audit: [{ at, by: party, text: 'Message received from external portal' }] });

  const c208 = conv('MSG-208', 'lee', now - 5 * HOUR, 'Order: Product B kits for November', 'Hi, we\'d like to order 40 kits of Product B for delivery in early November. Could you also send pricing for Product C reagents?');

  c207.messages.push({ by: 'marcus', at: t(0.9), vis: 'ext', text: 'Received, thank you. Order entered in SAP B1, confirmation to follow from our Manila office.' });
  c207.state = 'done'; c207.closed = t(0.9);
  c207.audit.push({ at: t(0.9), by: 'marcus', text: 'Marked handled: order entered against C10311' });
  const c206 = conv('MSG-206', 'cruz', t(2.4), 'Lead time for Product B', 'What is the current lead time for Product B reagent kits to Manila? We are planning Q1 volumes.');

/* ---------- state ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
if (!S || S.v !== 2) S = seed();
const ui = { persona: 'amy', view: 'work', sel: null, draft: null, filter: 'all', revealed: {}, ruleDomain: 'Customer', vis: {} };
try { const u = JSON.parse(localStorage.getItem(KEY + '-ui') || 'null'); if (u && person(u.persona).id) Object.assign(ui, { persona: u.persona, view: u.view, sel: u.sel }); } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '-ui', JSON.stringify({ persona: ui.persona, view: ui.view, sel: ui.sel })); } catch (e) {}
}
const me = () => person(ui.persona);
const isExt = () => me().org === 'ext';
const has = role => (me().roles || []).includes(role);
const req = id => S.requests.find(r => r.id === id);
const current = r => r.steps && r.steps.find(s => s.status === 'current');
function audit(r, text, by) { r.audit.push({ at: Date.now(), by: by || ui.persona, text }); }
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600);
}

/* Who needs to act next on a request */
function waitingOn(r) {
  if (r.kind === 'conv') return r.state === 'open' ? { role: 'Sales', who: holderOf('Sales') } : null;
  if (r.state === 'info') return { role: 'Requestor', who: person(r.requester) };
  const c = current(r); if (!c || r.state !== 'open') return null;
  return { role: c.role, who: holderOf(c.role), since: c.since };
}
function onMe(r, p) {
  p = p || me();
  if (p.org === 'ext') return false;

/* ---------- expected finish date ----------
   Typical response per approval step: median working days over the last 90 days of requests (demo history).
   In production this is recalculated nightly from the audit trail. */
const TYPICAL = { 'Quality/Regulatory': 0.9, 'BU Head': 3.1, 'Finance': 1.8, 'Business Support': 1.2, 'Procurement': 1.0, 'MDM': 0.6 };
const EMAIL_BASELINE_DAYS = 18;
function addWorkDays(ts, days) {
  let t = ts;
  while (days > 1e-6) { const step = Math.min(1, days); t += step * DAY; const wd = new Date(t).getDay(); if (wd !== 0 && wd !== 6) days -= step; }
  return t;
}
function workDaysBetween(a, b) { let n = 0; for (let t = a; t < b; t += DAY / 4) { const wd = new Date(t).getDay(); if (wd !== 0 && wd !== 6) n += 0.25; } return n; }

function eta(r) {
  if (r.kind !== 'mdm' || (r.state !== 'open' && r.state !== 'info')) return null;
  const c = current(r); if (!c) return null;
  const elapsed = c.since ? workDaysBetween(c.since, Date.now()) : 0;
  const typ = TYPICAL[c.role] || 1;
  let left = Math.max(typ - elapsed, 0.3) + (r.state === 'info' ? 1 : 0);
  r.steps.slice(r.steps.indexOf(c) + 1).forEach(st => { left += TYPICAL[st.role] || 1; });
  const who = holderOf(c.role);
  return { at: addWorkDays(Date.now(), left), left, role: c.role, who, typ, elapsed, late: r.state === 'open' && elapsed > typ };
}

/* ---------- orders waiting on customer setup ----------

const PRICE_OF = p => ((typeof REGIONAL !== 'undefined' && REGIONAL && REGIONAL.price) || { A: 180, B: 420, C: 95 })[p.slice(-1)] || 0;
function poValue(c) {
  const q = (c.qty || []).map(x => parseInt(x.replace(/,/g, ''), 10)).filter(n => n > 0);
  if (!q.length || !c.products.length) return 0;
  return q.reduce((a, n, i) => a + n * PRICE_OF(c.products[Math.min(i, c.products.length - 1)]), 0);
}

function extractEmail(text) {
  const ex = INTAKE_EXAMPLES.find(x => x.text.trim() === text.trim());
  if (ex) return Object.assign({ source: 'model' }, JSON.parse(JSON.stringify(ex.result)));
  const t = text, f = {}, notes = [];
  const domain = /supplier|vendor/i.test(t) ? 'Vendor' : /item code|sku|new product|consumable|reagent|catalog/i.test(t) ? 'Item' : /cost cent(er|re)/i.test(t) ? 'Cost Center' : 'Customer';
  const nameRes = [/(?:account|acct) for\s+([A-Z0-9][^,?\n(]{3,70}?)(?=\s+in\s|[,.?\n(]|$)/i, /(?:add supplier|supplier:|customer:|new supplier)\s+([A-Z0-9][^,?\n(]{3,70}?)(?=[,?\n(]|$)/i, /item code for (?:the )?([^,.?\n(]{3,70})/i];
  for (const re of nameRes) { const m = t.match(re); if (m) { f.name = m[1].trim().replace(/\.$/, ''); break; } }

  const days = t.match(/(\d{2,3})\s*days|net\s*(\d{2,3})/i); if (days) { const n = days[1] || days[2]; if (domain === 'Vendor') f.paymentTerms = 'Net ' + n; else f.creditTerms = 'Net ' + n; }
  const tax = t.match(/(?:reg(?:istration)?\.?\s*no\.?|ssm|uen|tax id|tin)\s*[:#]?\s*([A-Z0-9-]{6,})/i); if (tax && domain === 'Customer') f.taxId = tax[1];
  const bank = t.match(/bank:?\s*([^\n.]*\d[\d-]{5,})/i); if (bank && domain === 'Vendor') f.bank = bank[1].trim();

function sapHandoffHtml(r) {
  if (isExt() || r.state !== 'done' || !r.sapCode || r.kind !== 'mdm') return '';
  const pl = sapPayload(r), canSee = has('Finance') || has('MDM');
  const shown = JSON.parse(JSON.stringify(pl.body));
  if (!canSee) { if (shown.BPBankAccounts) shown.BPBankAccounts = '•••• restricted'; if (shown.CreditLimit) shown.CreditLimit = '•••• restricted'; }
  const lines = JSON.stringify(shown, null, 2).split('\n');
  return `<div class="panel"><h3>SAP B1 handoff</h3>
    <p style="margin:0">The approved record as an SAP B1 Service Layer call: <span class="mono">${pl.method} ${pl.endpoint}</span>. Nobody re-keys it.</p>
    <pre class="code">${esc(lines.slice(0, 16).join('\n'))}${lines.length > 16 ? '\n  …' : ''}</pre>
    ${pl.lookups.length ? `<p class="muted" style="margin:0;font-size:12.5px">Resolved at posting: ${pl.lookups.map(l => `<span class="mono">${esc(l.field)}</span> from "${esc(l.from)}"`).join(', ')}.</p>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${canSee ? `<button class="btn small" data-act="dl-json" data-id="${r.id}">Download Service Layer JSON</button><button class="btn small" data-act="dl-csv" data-id="${r.id}">Download CSV (Data Transfer Workbench)</button>` : '<span class="muted" style="font-size:12.5px">Downloads are limited to Finance and MDM because the file contains restricted fields.</span>'}</div>
    <p class="muted" style="margin:0;font-size:12.5px">Production: a Power Automate flow posts this as soon as MDM clicks Create, and writes the new code back to the hub. The file includes the approval trail (${pl.approvals.length} sign-offs) for audit.</p></div>`;
}
function etaHtml(r) {
  const e = eta(r); if (!e) return '';
  const total = workDaysBetween(r.created, e.at);
  return `<div class="eta"><span class="muted">Expected in SAP B1</span><b>${fmtDay(e.at)}</b><span class="muted">about ${Math.max(1, Math.round(total))} working days from submission, vs ${EMAIL_BASELINE_DAYS} days by email</span></div>
    ${e.late ? `<div class="callout warn"><p><b>Bottleneck: ${esc(e.role)}.</b> ${esc(e.who ? e.who.name : e.role)} usually responds in ${e.typ} days and this has waited ${e.elapsed.toFixed(1)}. Every working day it waits pushes the finish date back a day.</p></div>` : ''}`;
}
function auditHtml(r) {
  return `<div class="panel"><h3>Audit trail</h3><ul class="audit">${r.audit.slice().reverse().map(a => `<li><time class="mono">${stamp(a.at)}</time><span><b>${esc(a.by === 'system' ? 'System' : person(a.by).name)}</b> ${esc(a.text)}</span></li>`).join('')}</ul><p class="muted" style="margin:0;font-size:12px">Append-only. Every approval, change and view of restricted fields is recorded with who and when.</p></div>`;
}

function viewMaster() {
  const q = ui.mq || '';
  const rows = S.records.filter(r => !q || r.name.toLowerCase().includes(q.toLowerCase()) || r.code.toLowerCase().includes(q.toLowerCase()) || dice(q, r.name) >= 0.6)
    .sort((a, b) => b.created - a.created);
  return `<div class="head"><div><h2>SAP B1 master records</h2><p>A read-only mirror of Business Partners, Items and Cost Centers. Searching here and in the request form uses fuzzy matching, so "Natl Univ Hosp" still finds National University Hospital.</p></div></div>
  <input type="text" id="mq" placeholder="Search by name or code" value="${esc(q)}" style="max-width:360px">
  <div class="tablewrap"><table><thead><tr><th>Code</th><th>Type</th><th>Name</th><th>Entity</th><th>Country</th><th>Orders, 12 months</th><th>Created</th></tr></thead><tbody>
  ${rows.map(r => { const h = r.type === 'Customer' ? historyOf(r.code) : null; return `<tr><td class="mono">${esc(r.code)}</td><td>${esc(r.type)}</td><td>${esc(r.name)}</td><td>${esc(r.entity)}</td><td>${esc(COUNTRIES[r.country] || r.country)}</td><td class="mono">${h && h.value ? sgdShort(h.value) : '<span class="muted">–</span>'}</td><td class="muted">${rel(r.created)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">No records match.</td></tr>'}
  </tbody></table></div>`;
}

function viewRules() {
  const canEdit = has('MDM');
  const dn = ui.ruleDomain, dom = S.config.domains[dn];
  const tabs = Object.keys(S.config.domains).map(k => `<button aria-pressed="${k === dn}" data-act="ruledom" data-d="${k}">${k}</button>`).join('');
  const dis = canEdit ? '' : 'disabled';
  return `<div class="head"><div><h2>Forms &amp; approval rules</h2><p>The MDM team changes required fields and approval steps here, without IT. A new business unit or regulatory step is a five-minute change, and everyone sees the new form and route immediately.</p></div></div>
  ${canEdit ? '' : `<div class="callout info"><p>Only the MDM team can change these rules. Switch to Priya to try it.</p></div>`}
  <div class="seg" role="group" aria-label="Record type">${tabs}</div>
  <div class="detail"><div class="panel"><h3>Fields on the ${esc(dn)} form</h3>
    <div class="tablewrap"><table><thead><tr><th>Field</th><th>Required</th><th>Restricted</th><th></th></tr></thead><tbody>
    ${dom.fields.map((f, i) => `<tr><td>${esc(f.label)}</td><td><input type="checkbox" aria-label="Required" data-act="freq" data-i="${i}" ${f.req ? 'checked' : ''} ${dis || (f.k === 'name' ? 'disabled' : '')}></td><td><input type="checkbox" aria-label="Restricted" data-act="fsens" data-i="${i}" ${f.sensitive ? 'checked' : ''} ${dis}></td><td>${f.k === 'name' ? '' : `<button class="btn small danger" data-act="fdel" data-i="${i}" ${dis}>Remove</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="newfield" placeholder="New field, e.g. Cold-chain storage temp" style="flex:1;min-width:180px" ${dis}><button class="btn" data-act="fadd" ${dis}>Add field</button></div>
  </div>
  <aside class="section"><div class="panel"><h3>Approval route</h3><div class="chain">
    ${dom.chain.map((r, i) => `<div class="link"><span class="mono muted">${i + 1}</span><b>${esc(r)}</b><span class="muted" style="font-size:12px">${esc((holderOf(r) || {}).name || '')} · usually ${TYPICAL[r] || 1}d</span><button class="btn small" data-act="cup" data-i="${i}" ${dis || (i === 0 ? 'disabled' : '')} aria-label="Move up">↑</button><button class="btn small danger" data-act="cdel" data-i="${i}" ${dis || (dom.chain.length < 2 ? 'disabled' : '')} aria-label="Remove step">✕</button></div>`).join('')}
    <div class="link" style="background:var(--sunken)"><span class="mono muted">${dom.chain.length + 1}</span><b>MDM check &amp; create in SAP B1</b><span class="muted" style="font-size:12px">always last</span></div></div>
    <div style="display:flex;gap:8px"><select id="addstep" style="flex:1" ${dis}>${ROLES.filter(r => r !== 'MDM' && !dom.chain.includes(r)).map(r => `<option>${esc(r)}</option>`).join('')}</select><button class="btn" data-act="cadd" ${dis}>Add step</button></div>
    <p class="muted" style="margin:0;font-size:12.5px">Changes apply to new requests. Requests already in flight keep the route they started with.</p></div>
    <div class="panel"><h3>Change history · v${S.config.version}</h3><ul class="audit">${S.configLog.slice().reverse().map(a => `<li><time class="mono">${stamp(a.at)}</time><span><b>${esc(person(a.by).name)}</b> ${esc(a.text)}</span></li>`).join('')}</ul></div>
  </aside></div>`;
}

  const k = Math.round(Math.min(Math.abs(g) / 0.4, 1) * 50);
  return `color-mix(in srgb, var(${g >= 0 ? '--pos' : '--neg'}) ${k}%, var(--surface))`;
}

/* ---------- business case calculator ---------- */
const WI_DEFAULT = { conv: 10, winback: 20, margin: 25, setup: 4, reqs: 60, mins: 45, rate: 45, build: 60000, run: 15000 };
const WI_SPEC = [
  ['conv', 'Cross-sell leads that convert', 0, 50, 5, v => v + '%'], ['winback', 'At-risk revenue won back', 0, 60, 5, v => v + '%'],
  ['margin', 'Gross margin on that revenue', 10, 60, 5, v => v + '%'], ['setup', 'Customer setup time with the hub', 2, 18, 1, v => v + ' days'],
  ['reqs', 'MDM requests a month', 10, 200, 10, v => v], ['mins', 'Minutes saved per request (chasing, re-keying, rework)', 0, 120, 5, v => v + ' min'],
  ['rate', 'Loaded staff cost per hour', 20, 100, 5, v => 'SGD ' + v], ['build', 'One-off build (Power Platform partner)', 10000, 150000, 5000, v => 'SGD ' + fmtK(v)],
  ['run', 'Running cost a year (licences, support)', 0, 60000, 5000, v => 'SGD ' + fmtK(v)],
];
function whatIfCalc(w) {
  const xs = RG.cleanup.after.xs_value * w.conv / 100;
  const risk = RG.dropoffs.reduce((a, d) => a + d.at_risk_year, 0) * w.winback / 100;
  const revenue = (xs + risk) * w.margin / 100;
  const forecastHours = RG.assumptions.forecast_days_per_country_month * 5 * 12 * 8;
  const prod = (w.reqs * 12 * w.mins / 60 + forecastHours) * w.rate;
  const gross = revenue + prod, net = gross - w.run;
  const wt = RG.traffic.waiting, sooner = Math.max(0, wt.avg_wait - w.setup);
  return { xs, risk, revenue, prod, gross, net, payback: net > 0 ? w.build / (net / 12) : null, sooner, waitingValue: wt.value, hours: w.reqs * 12 * w.mins / 60 + forecastHours };
}
function whatIfSection() {
  const w = ui.wi || WI_DEFAULT;
  return `<section class="section"><div class="head" style="align-items:center"><h3>Business case: drag to test the assumptions</h3><button class="btn small" data-act="wi-reset">Reset</button></div>
    <div class="detail"><div class="panel wi">${WI_SPEC.map(([k, label, mn, mx, st, f]) => `<label class="wi-row"><span>${esc(label)}</span><b id="wv-${k}">${f(w[k])}</b><input type="range" min="${mn}" max="${mx}" step="${st}" value="${w[k]}" data-wi="${k}" aria-label="${esc(label)}"></label>`).join('')}</div>
    <div class="panel" id="wi-out" aria-live="polite">${whatIfOut(w)}</div></div></section>`;
}
function whatIfOut(w) {
  const c = whatIfCalc(w), bars = [['Margin on cross-sell', c.xs * w.margin / 100], ['Margin on won-back accounts', c.risk * w.margin / 100], ['Staff time freed', c.prod]];
  const mx = Math.max(...bars.map(b => b[1]), 1);
  return `<span class="muted">Net value a year</span><b class="wi-big">${sgd(c.net)}</b>
    <p style="margin:0">${c.payback == null ? 'Does not pay back at these settings.' : `Pays back the ${sgd(w.build)} build in <b>${c.payback < 1 ? 'under a month' : c.payback.toFixed(1) + ' months'}</b>.`}</p>
    <ul class="hbars">${bars.map(([l, v]) => `<li><span>${l}</span><span class="mono">${sgd(v)}</span><div class="bar"><i style="width:${(v / mx * 100).toFixed(1)}%;background:var(--s1)"></i></div></li>`).join('')}</ul>
    <p class="muted" style="margin:0;font-size:12.5px">Minus ${sgd(w.run)} running cost. Staff time: ${fmtN(c.hours)} hours a year, including ${RG.assumptions.forecast_days_per_country_month * 5 * 12} analyst-days no longer spent building spreadsheet forecasts.</p>
    <div class="callout info"><p>New customers' first orders reach invoice <b>${c.sooner.toFixed(0)} days sooner</b> (setup ${RG.traffic.waiting.avg_wait} → ${w.setup} days) on ${sgd(c.waitingValue)} of orders a year. Cash arrives earlier; not counted as extra value above.</p></div>`;
}
function updateWhatIf() {

function dropSection(spark) {
  const mode = ui.dropMode || 'after', B = RG.dropoffs_before, A = RG.dropoffs;

  const rowH = (d, cls) => `<tr class="${cls || ''}"><td><span class="nm">${esc(d.name)}</span> <span class="mono muted">${esc(d.code)}</span>${cls === 'gone' ? `<div class="why">${esc(d.explain || 'Merged with a duplicate record')}</div>` : ''}</td><td>${esc(RG.countries[d.country])}</td><td>${d.products.join(', ')}</td><td class="mono">${sgd(d.prior_month)}</td><td class="mono">${sgd(d.recent_month)}</td><td>${spark(d.trend)}</td><td class="mono"><b>${sgd(d.at_risk_year)}</b></td></tr>`;
  const head = `<thead><tr><th>Account</th><th>Country</th><th>Products</th><th>Monthly, a year ago</th><th>Monthly, last 3 months</th><th>Last 12 months</th><th>At risk / year</th></tr></thead>`;
  const list = mode === 'before' ? B : A;
  return `<section class="section"><div class="head" style="align-items:center"><h3>Call list: accounts dropping off · ${list.length}</h3>

    <div class="callout ${mode === 'before' ? 'warn' : 'info'}"><p>${mode === 'before'
      ? `<b>${B.length} accounts flagged, ${sgd(sum(B))} a year "at risk".</b> This is the list Sales gets from SAP B1 as it is today, with duplicate customer records left in.`
      : `<b>${A.length} accounts, ${sgd(sum(A))} a year at risk.</b> Merging duplicates removed ${gone.length} false alerts worth ${sgd(sum(gone))}: those customers never left, they were ordering under a second record.`}</p></div>

    ${list.map(d => rowH(d)).join('')}

    </tbody></table></div>`;
}
function FUTURE_LBL() { return RG.period.future.map(m => monLbl(m, false)).join(', ') + ' ' + RG.period.future[0].slice(0, 4); }

function drawRegional() {
  const el = document.getElementById('trend'); if (!el || !RG) return;
  const key = ui.rsel || 'ALL-ALL', s = seriesFor(key), base = RG.best_baseline;
  const months = RG.period.chart_months.concat(RG.period.future);
  const nA = s.actual.length, nB = s[base].length, n = months.length, b0 = nA - nB;
  const W = Math.max(300, el.clientWidth), H = 260, m = { l: 48, r: 14, t: 12, b: 26 };
  const vals = s.actual.concat(s.gbm, s[base], s.future);
  const top = niceMax(Math.max(...vals) * 1.05), ticks = 4;
  const x = i => m.l + (W - m.l - m.r) * i / (n - 1), y = v => m.t + (H - m.t - m.b) * (1 - v / top);
  const path = (arr, off) => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i + off).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const half = (W - m.l - m.r) / (n - 1) / 2;
  let g = '';
  g += `<rect x="${(x(b0) - half).toFixed(1)}" y="${m.t}" width="${(x(nA - 1) - x(b0) + 2 * half).toFixed(1)}" height="${H - m.t - m.b}" fill="var(--sunken)" opacity=".6"/>`;

      ui.draft = newDraft('Customer'); Object.assign(ui.draft, { entity: 'SPD', country: p.country, fromConv: r.id, party: r.party, note: `Raised from customer message ${r.id}: ${r.subject}` });
      ui.draft.fields = { name: p.company, country: p.country, contact: '' };
      if (!me().roles.includes('Requestor')) { /* sales staff can raise setup on behalf of the customer */ }
      ui.view = 'new'; ui.from = 'inbound'; render(); window.scrollTo(0, 0); toast('Form pre-filled from the customer message'); break;
    }
    case 'handled': r.state = 'done'; r.closed = Date.now(); audit(r, 'Marked handled'); render(); toast('Marked handled'); break;
    case 'reclass': r.cls.kind = r.cls.kind === 'po' ? 'enquiry' : 'po'; r.cls.reasons = ['reclassified by ' + me().name]; audit(r, 'Reclassified as ' + (r.cls.kind === 'po' ? 'purchase order' : 'enquiry')); render(); break;
    case 'send-ext': {
      const s = document.getElementById('x-subject').value.trim(), t = document.getElementById('x-text').value.trim();
      if (!t) { document.getElementById('x-text').focus(); return; }
      const p = me(), id = 'MSG-' + (S.cseq++);
      const c = { id, kind: 'conv', party: p.id, requester: p.id, created: Date.now(), country: p.country, subject: s || t.slice(0, 60), text: t, cls: classify(s + '\n' + t, p.company), assigned: 'Sales', state: 'open', messages: [], audit: [{ at: Date.now(), by: p.id, text: 'Message received from external portal' }] };
      c.messages.push({ by: 'system', at: Date.now(), vis: 'int', text: `Auto-tagged as ${c.cls.kind === 'po' ? 'purchase order' : 'enquiry'}. ${holderOf('Sales').name} notified in Teams.` });
      S.requests.unshift(c); ui.from = 'work'; open(id); toast('Sent. Lives Group has been notified'); break;
    }
    case 'ruledom': ui.ruleDomain = b.dataset.d; render(); break;
    case 'rsel': { const y0 = window.scrollY; ui.rsel = b.dataset.k; render(); window.scrollTo(0, y0); break; }
    case 'dropmode': { const y0 = window.scrollY; ui.dropMode = b.dataset.m; render(); window.scrollTo(0, y0); break; }
    case 'fdel': { const dom = S.config.domains[ui.ruleDomain], f = dom.fields[+b.dataset.i]; dom.fields.splice(+b.dataset.i, 1); cfgChange(`Removed "${f.label}" from ${ui.ruleDomain}`); render(); toast('Field removed'); break; }
    case 'fadd': {
      const el = document.getElementById('newfield'), label = el.value.trim(); if (!label) { el.focus(); return; }
      const dom = S.config.domains[ui.ruleDomain];
      dom.fields.push({ k: 'x' + Date.now().toString(36), label, req: true, sensitive: false, type: 'text' });
      cfgChange(`Added "${label}" as required for ${ui.ruleDomain}`); render(); toast('Field added. New requests will ask for it'); break;
    }
    case 'cup': { const ch = S.config.domains[ui.ruleDomain].chain, i = +b.dataset.i; [ch[i - 1], ch[i]] = [ch[i], ch[i - 1]]; cfgChange(`Moved ${ch[i - 1]} before ${ch[i]} on ${ui.ruleDomain} route`); render(); break; }
    case 'cdel': { const ch = S.config.domains[ui.ruleDomain].chain, [x] = ch.splice(+b.dataset.i, 1); cfgChange(`Removed ${x} from ${ui.ruleDomain} route`); render(); toast('Step removed'); break; }
    case 'cadd': { const v = document.getElementById('addstep').value; if (!v) return; S.config.domains[ui.ruleDomain].chain.push(v); cfgChange(`Added ${v} to ${ui.ruleDomain} route`); render(); toast(v + ' added to the route'); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'persona') { ui.persona = t.value; ui.view = 'work'; ui.sel = null; ui.from = 'work'; render(); return; }
  if (t.dataset.act === 'freq' || t.dataset.act === 'fsens') {
    const f = S.config.domains[ui.ruleDomain].fields[+t.dataset.i];
    if (t.dataset.act === 'freq') { f.req = t.checked; cfgChange(`Made "${f.label}" ${t.checked ? 'required' : 'optional'} for ${ui.ruleDomain}`); }
    else { f.sensitive = t.checked; cfgChange(`Made "${f.label}" ${t.checked ? 'restricted' : 'unrestricted'} for ${ui.ruleDomain}`); }
    render(); return;
  }
  if (t.id === 'dup-ok') { ui.draft.dupOk = t.checked; updateNewSide(); return; }
  if ((t.dataset.field || t.dataset.meta) && t.tagName === 'SELECT') onDraftInput(t);
});
function onDraftInput(t) {
  if (!ui.draft) return;
  if (t.dataset.field) ui.draft.fields[t.dataset.field] = t.value;
  else if (t.dataset.meta) ui.draft[t.dataset.meta] = t.value;
  if (t.dataset.meta !== 'note') updateNewSide();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field || t.dataset.meta) onDraftInput(t);
  else if (t.id === 'dup-note') { ui.draft.dupNote = t.value; const keep = t.selectionStart; updateNewSide(); const n = document.getElementById('dup-note'); n.focus(); n.setSelectionRange(keep, keep); }
  else if (t.id === 'x-subject' || t.id === 'x-text') updateSendPreview();
  else if (t.dataset.wi) { ui.wi = Object.assign({}, ui.wi || WI_DEFAULT, { [t.dataset.wi]: +t.value }); updateWhatIf(); }
  else if (t.id === 'intake-text') ui.intakeText = t.value;
  else if (t.id === 'mq') { ui.mq = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('mq'); n.focus(); n.setSelectionRange(pos, pos); }
});

render();
})();
</script>
